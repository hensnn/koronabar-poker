services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TZ:-Europe/Prague}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Hlavní šifrovací klíč (pokud není v .env jako MASTER_KEY). Zálohujte ho zvlášť od databáze.
      - appdata:/data

  # Denní záloha databáze (pg_dump) s nastavitelnou retencí.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/koronabar-$$(date +%Y%m%d-%H%M%S).sql.gz
          pg_dump --no-owner | gzip > "$$f" && echo "Záloha uložena: $$f"
          find /backups -name 'koronabar-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep $$((BACKUP_EVERY_HOURS * 3600))
        done

  # Hlasatel: vlastní český hlas Piper (protokol Wyoming). Ve výchozím stavu vypnutý, zapíná se příkazem
  #   docker compose --profile piper up -d
  # a v aplikaci v Správa → Hlasatel (adresa „piper“, port 10200). Při prvním startu si stáhne hlas.
  piper:
    image: rhasspy/wyoming-piper
    profiles: ["piper"]
    restart: unless-stopped
    command: --voice ${PIPER_VOICE:-cs_CZ-jirka-medium}
    volumes:
      - piperdata:/data

volumes:
  piperdata:
  dbdata:
  appdata:
  backups:
