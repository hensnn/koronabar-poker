<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>KoronaBar Poker: bez připojení</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        background: ButtonFace;
        color: ButtonText;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jsi offline</h1>
      <p>Aplikace potřebuje internet, aby ukázala stoly a turnaje. Zkontroluj připojení a zkus to znovu. Tvoje žetony a nastavení jsou v pořádku, ukládají se na serveru.</p>
      <p><button onclick="location.reload()">Zkusit znovu</button></p>
    </main>
  </body>
</html>
